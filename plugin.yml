name: AnyEnchant
version: 1.0.0
main: fr.anyenchant.AnyEnchant
api-version: '1.21'
description: Enchante n'importe quel objet avec n'importe quel enchantement, par commande ou avec des livres.
commands:
  enchantany:
    description: Enchante l'objet en main avec n'importe quel enchantement
    usage: /enchantany <enchantement> [niveau]
    permission: anyenchant.use
  enchantbook:
    description: Donne un livre a appliquer sur un objet par clic gauche
    usage: /enchantbook <enchantement> [niveau] [quantite]
    permission: anyenchant.use
permissions:
  anyenchant.use:
    description: Utiliser les commandes et les livres AnyEnchant
    default: op
